<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="World of Maps - Daily Geography and Data Guessing Game">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2545"/>
      <stop offset="0.55" stop-color="#13386b"/>
      <stop offset="1" stop-color="#1e4b84"/>
    </linearGradient>
    <radialGradient id="globe" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#7fd1ff"/>
      <stop offset="0.5" stop-color="#3a8fd6"/>
      <stop offset="1" stop-color="#1b4f86"/>
    </radialGradient>
    <radialGradient id="atmo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.7" stop-color="#4a90e2" stop-opacity="0"/>
      <stop offset="0.92" stop-color="#7fd1ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7fd1ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle dot grid -->
  <g fill="#ffffff" opacity="0.05">
    <circle cx="980" cy="90" r="3"/><circle cx="1040" cy="140" r="2"/><circle cx="1100" cy="80" r="2.5"/>
    <circle cx="120" cy="540" r="2.5"/><circle cx="70" cy="470" r="2"/><circle cx="180" cy="560" r="2"/>
  </g>

  <!-- Globe -->
  <g transform="translate(330 315)">
    <circle r="250" fill="url(#atmo)"/>
    <circle r="210" fill="url(#globe)" stroke="#bfe6ff" stroke-opacity="0.35" stroke-width="2"/>
    <!-- meridians / parallels -->
    <g fill="none" stroke="#eaf6ff" stroke-opacity="0.30" stroke-width="2">
      <ellipse rx="210" ry="70"/>
      <ellipse rx="210" ry="140"/>
      <ellipse rx="70" ry="210"/>
      <ellipse rx="140" ry="210"/>
      <line x1="-210" y1="0" x2="210" y2="0"/>
      <line x1="0" y1="-210" x2="0" y2="210"/>
    </g>
    <!-- abstract data "landmasses" -->
    <g fill="#9be8a8" fill-opacity="0.85">
      <path d="M-120,-90 q40,-30 80,-10 q30,15 10,45 q-25,35 -70,25 q-45,-10 -20,-60 Z"/>
      <path d="M40,-30 q50,-10 70,25 q15,40 -30,55 q-55,12 -65,-35 q-8,-35 25,-45 Z"/>
      <path d="M-60,70 q45,-5 55,35 q5,40 -45,45 q-40,3 -45,-40 q-2,-35 30,-40 Z"/>
    </g>
  </g>

  <!-- Text. Sizes and the 620 origin are chosen so the longest line clears the 1200px
       canvas: at 78px the title used to render past the right edge and lose its last
       letters. scripts/build-og-image.mjs asserts nothing overflows. -->
  <g transform="translate(620 0)">
    <text x="0" y="232" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#ffffff">World of Maps</text>
    <text x="0" y="296" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="31" font-weight="600" fill="#bfe6ff">Daily Geography &amp; Data</text>
    <text x="0" y="338" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="31" font-weight="600" fill="#bfe6ff">Guessing Game</text>
    <text x="0" y="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#ffffff" opacity="0.85">Guess the dataset behind the map,</text>
    <text x="0" y="430" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#ffffff" opacity="0.85">on an interactive 3D globe.</text>
    <rect x="0" y="468" width="290" height="56" rx="28" fill="#ffca1a"/>
    <text x="145" y="505" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0b2545">worldofthemaps.com</text>
  </g>
</svg>
